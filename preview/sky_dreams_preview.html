<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sky Dreams — Grace, la princesa de las nubes (Vista previa)</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0d0a26;overflow:hidden;font-family:sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{border-radius:18px;box-shadow:0 0 60px rgba(255,104,166,.35),0 0 140px rgba(106,63,191,.35);
         touch-action:none;cursor:pointer;max-height:96vh;max-width:96vw}

        font-size:12px;pointer-events:none}

<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="hint">◀ ▶ / A D para mover &nbsp;•&nbsp; Espacio = jugar &nbsp;•&nbsp; P = pausa &nbsp;•&nbsp; M = sonido</div>
<script>
"use strict";
(function(){

// ------------------------------------------------------------ setup
const LW = 440, LH = 880;
const cv = document.getElementById("cv");
let ctx = cv.getContext("2d");
function fit(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const vw = window.innerWidth  || document.documentElement.clientWidth  || 320;
  const vh = window.innerHeight || document.documentElement.clientHeight || 568;
  const s = Math.min(vw / LW * 0.96, vh / LH * 0.96);
  if (!(s > 0)) return;
  cv.style.width  = (LW * s) + "px";
  cv.style.height = (LH * s) + "px";
  cv.width  = Math.round(LW * dpr); cv.height = Math.round(LH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", fit);
fit();
// keep retrying until the iframe reports a real size (preview iframes start at 0)
const fitTimer = setInterval(() => {
  const r = cv.getBoundingClientRect();
  if (r.width > 10) { clearInterval(fitTimer); }
  else fit();
}, 250);
setTimeout(() => clearInterval(fitTimer), 10000);

const W = LW, H = LH;
const TAU = Math.PI * 2;
const rand = Math.random;
const sin = Math.sin, cos = Math.cos, abs = Math.abs, min = Math.min, max = Math.max;
const clamp = (v,a,b)=> v<a?a : v>b?b : v;

// ------------------------------------------------------------ palette
const C = {
  SKY_TOP:[26,21,80], SKY_BOT:[255,177,214],
  PINK:"#FF68A6", PINK_L:"#FF8ABE", PURPLE:"#685BBE", PURPLE_L:"#8579DC",
  GOLD:"#FFE577", GOLD_D:"#FFC43C", SOFT:"#FFE0F6", PANEL:"rgba(27,20,78,0.59)",
  CYAN:"#7EE7F5"
};

// ------------------------------------------------------------ audio
const Au = {
  ctx:null, master:null, mus:null, on:true, started:false, noiseBuf:null, loopTimer:null,
  init(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = 0.6;
    this.master.connect(this.ctx.destination);
    this.mus = this.ctx.createGain(); this.mus.gain.value = this.on ? 0.16 : 0.0;
    this.mus.connect(this.master);
    const len = this.ctx.sampleRate * 0.3;
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = rand()*2-1;
  },
  beep(type, f0, f1, dur, vol, when){
    if(!this.ctx || !this.on) return;
    const t = (when || this.ctx.currentTime);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if(f1 !== f0) o.frequency.exponentialRampToValueAtTime(max(30,f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  seq(notes, step, type, vol){
    if(!this.ctx || !this.on) return;
    const t0 = this.ctx.currentTime;
    notes.forEach((f,i)=> this.beep(type, f, f, step*(i===notes.length-1?1.6:1), vol, t0 + i*step));
  },
  noise(dur, vol, freq, when){
    if(!this.ctx || !this.on) return;
    const t = (when || this.ctx.currentTime);
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const f = this.ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=freq; f.Q.value=0.8;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  },
  sfx(n){
    switch(n){
      case "jump":   this.beep("square", 320, 800, 0.18, 0.22); break;
      case "star":   this.seq([1046.5,1318.5,1568,2093], 0.055, "triangle", 0.22); break;
      case "power":  this.seq([523.25,659.25,783.99,1046.5,1318.5], 0.07, "triangle", 0.25); break;
      case "hit":    this.beep("square", 440, 195, 0.28, 0.22); break;
      case "over":   this.seq([659.25,523.25,392], 0.17, "sine", 0.28); break;
      case "click":  this.beep("sine", 1800, 1800, 0.05, 0.18); break;
      case "best":   this.seq([523.25,659.25,783.99,1046.5,1318.5,1568], 0.09, "triangle", 0.25); break;
    }
  },
  // ------- background music (Am F C G, same structure as the APK asset)
  musOsc(type, f, t, dur, vol, dest){
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.mus);
    o.start(t); o.stop(t + dur + 0.03);
  },
  musNoise(t, dur, vol, freq){
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const f = this.ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=freq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.mus);
    s.start(t); s.stop(t + dur + 0.02);
  },
  kick(t){
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
    o.connect(g); g.connect(this.mus);
    o.start(t); o.stop(t + 0.15);
  },
  scheduleLoop(){
    if(!this.ctx || !this.started) return;
    const beat = 60/118, e8 = beat/2, barB = 8, t0 = this.ctx.currentTime + 0.1;
    const chords = [[220,261.63,329.63],[174.61,220,261.63],[130.81,164.81,196],[196,246.94,293.66]];
    const bassR  = [110, 87.31, 65.41, 98];
    const mel = [[880,1],[987.77,1],[880,1],[659.25,1],[783.99,1],[659.25,1],[587.33,2],
                 [659.25,1],[783.99,1],[880,1],[1046.5,1],[987.77,1],[783.99,1],[659.25,2]];
    for(let rep=0; rep<2; rep++){
      for(let ci=0; ci<4; ci++){
        const start = t0 + (rep*4 + ci) * barB * beat;
        const ch = chords[ci];
        ch.forEach(f => this.musOsc("sine", f, start, barB*beat, 0.05));
        for(let k=0; k<barB*2; k++){
          this.musOsc("triangle", [ch[0]*2, ch[2]*2, ch[1]*2, ch[2]*2][k%4], start + k*e8, e8*0.9, 0.07);
          const bf = (k%4===3) ? bassR[ci]*2 : bassR[ci];
          this.musOsc("sine", bf, start + k*e8, e8*0.85, 0.24);
        }
        for(let b=0; b<barB; b++){
          const tb = start + b*beat;
          if(b===0 || b===4) this.kick(tb);
          if(b===2 || b===6) this.musNoise(tb, 0.09, 0.25, 2000);
          for(let h=0; h<2; h++) this.musNoise(tb + h*e8, 0.03, 0.05, 7000);
        }
      }
      let tc = t0 + rep * 32 * beat;
      mel.forEach(([f,b])=>{ this.musOsc("triangle", f, tc, b*beat*0.95, 0.17); tc += b*beat; });
    }
    const dur = 64 * beat;
    this.loopTimer = setTimeout(()=> this.scheduleLoop(), dur*1000 - 250);
  },
  startMusic(){
    this.init();
    if(!this.ctx || this.started) return;
    this.started = true;
    if(this.ctx.state === "suspended") this.ctx.resume();
    this.scheduleLoop();
  },
  duck(low){ if(this.mus) this.mus.gain.value = low ? 0.05 : (this.on ? 0.16 : 0); },
  toggle(){
    this.on = !this.on;
    if(this.mus) this.mus.gain.value = this.on ? 0.16 : 0;
    return this.on;
  }
};

// ------------------------------------------------------------ models
const T_NORMAL=0, T_MOVING=1, T_BOOST=2;

class Platform{
  constructor(x,y,w,h,type,hue,phase,speed,range){
    this.x=x; this.y=y; this.w=w; this.h=h; this.type=type; this.hue=hue;
    this.baseX=x; this.phase=phase; this.speed=speed; this.range=range;
  }
}
class Pickup{ constructor(x,y,gem,phase){ this.x=x; this.y=y; this.gem=gem; this.phase=phase; this.taken=false; } }
class Particle{ constructor(x,y,vx,vy,life,maxLife,color,size,confetti,spin,rot){
  Object.assign(this,{x,y,vx,vy,life,maxLife,color,size,confetti,spin,rot}); } }
class Ring{ constructor(x,y,r,maxR,life,color){ Object.assign(this,{x,y,r,maxR,life,color}); } }
class FloatText{ constructor(x,y,text,color,life){ Object.assign(this,{x,y,text,color,life}); } }
class TrailDot{ constructor(x,y){ this.x=x; this.y=y; this.life=0.32; } }

class Btn{
  constructor(label,w,h,cTop,cBot){ Object.assign(this,{label,w,h,cTop,cBot,x:0,y:0,press:0}); }
  layout(cx,cy){ this.x=cx; this.y=cy; }
  hit(px,py){ return abs(px-this.x)<=this.w/2+16 && abs(py-this.y)<=this.h/2+16; }
}

const btnPlay    = new Btn("JUGAR  ✦", 260, 58, C.PINK, "#FF3C82");
const btnSound   = new Btn("SONIDO: ON", 260, 58, "#26A098", "#187872");
const btnCredits = new Btn("CRÉDITOS", 260, 58, C.PURPLE, "#50429E");
const btnBack    = new Btn("VOLVER", 260, 58, C.PURPLE, "#50429E");
const btnRetry   = new Btn("REINTENTAR", 280, 58, C.PINK, "#FF3C82");
const btnMenu    = new Btn("MENÚ", 280, 58, C.PURPLE, "#50429E");
const btnResume  = new Btn("CONTINUAR", 280, 58, "#26A098", "#187872");
const btnExit    = new Btn("SALIR AL MENÚ", 280, 58, C.PURPLE, "#50429E");
const btnPause   = new Btn("❚❚", 64, 52, "rgba(27,20,78,0.47)", "rgba(27,20,78,0.47)");
const ALLBTNS = [btnPlay,btnSound,btnCredits,btnBack,btnRetry,btnMenu,btnResume,btnExit,btnPause];
function layoutButtons(){
  btnPlay.layout(W/2, H*0.640); btnSound.layout(W/2, H*0.740); btnCredits.layout(W/2, H*0.840);
  btnBack.layout(W/2, H*0.800); btnRetry.layout(W/2, H*0.620); btnMenu.layout(W/2, H*0.720);
  btnResume.layout(W/2, H*0.560); btnExit.layout(W/2, H*0.680); btnPause.layout(W-52, 110);
}
layoutButtons();

// background
const bgStars = [], bgClouds = [];
for(let i=0;i<26;i++) bgStars.push([rand()*W, rand()*H*0.75, 1.2+rand()*2.2, 0.8+rand()*2.4, rand()*TAU]);
for(let i=0;i<7;i++){
  const layer = i<4 ? 0 : 1;
  bgClouds.push([rand()*W, rand()*H, 0.5+rand()*0.9,
    (4+rand()*7)*(layer===0?0.4:1), layer===0?40:85]);
}

// ------------------------------------------------------------ game state
let state=0, time=0, last=0;
let px=W/2, py=H*0.68, vx=0, vy=0, jumpPulse=0, capeT=0, faceL=false;
let cameraY=0, score=0, best=+(localStorage.getItem("sky_best")||0), level=1, stars=0;
let combo=0, comboTimer=0, spawnY=0;
let flash=0, shake=0, panelT=0, newBest=false, deathHandled=false;
let left=false, right=false;
const platforms=[], pickups=[], particles=[], rings=[], floats=[], trail=[];

function addPlatform(){
  const gap = 82 + rand()*40 + min(46, level*3);
  spawnY -= gap;
  const w = (118 - min(38,(level-1)*5)) + rand()*30;
  const margin = 26;
  const x = margin + rand() * max(1, W - w - margin*2);
  let type = T_NORMAL;
  const roll = rand();
  const movChance = min(0.34, 0.06 + level*0.035);
  if(roll < 0.08) type = T_BOOST;
  else if(roll < 0.08 + movChance && platforms.length > 3) type = T_MOVING;
  const speed = type===T_MOVING ? 45 + rand()*55 + level*4 : 0;
  let range = type===T_MOVING ? 40 + rand()*90 : 0;
  if(type===T_MOVING){
    range = min(range, min(x - margin, W - margin - (x + w)));
    range = max(10, range);
  }
  platforms.push(new Platform(x, spawnY, w, 26, type, (rand()*3)|0, rand()*TAU, speed, range));
  if(type !== T_BOOST && platforms.length > 2){
    const r = rand();
    if(r < 0.06) pickups.push(new Pickup(x + w/2, spawnY - 52, true, rand()*TAU));
    else if(r < 0.40) pickups.push(new Pickup(x + w/2, spawnY - 48, false, rand()*TAU));
  }
}
function reset(){
  state=1; score=0; level=1; stars=0; combo=0; comboTimer=0;
  cameraY=0; vx=0; vy=0; newBest=false; deathHandled=false; panelT=0;
  px=W/2; py=H*0.68;
  platforms.length=0; pickups.length=0; particles.length=0; rings.length=0; floats.length=0; trail.length=0;
  platforms.push(new Platform(W/2-80, H*0.78, 160, 28, T_NORMAL, 0, 0, 0, 0));
  spawnY = H*0.78;
  for(let i=0;i<14;i++) addPlatform();
  flash = 0.5;
  Au.sfx("click");
}
function burst(x,y,color,n=12,power=1){
  for(let i=0;i<n;i++){
    const a = rand()*TAU, sp = (60+rand()*160)*power;
    particles.push(new Particle(x,y,cos(a)*sp,sin(a)*sp-40,0.6+rand()*0.5,1.1,color,3+rand()*4,false,0,0));
  }
}
function confetti(x,y,n){
  const cols=[C.PINK,C.GOLD,C.PURPLE_L,C.CYAN,"#FFFFFF"];
  for(let i=0;i<n;i++){
    particles.push(new Particle(x+(rand()-0.5)*120, y, (rand()-0.5)*260, -rand()*320-60,
      1.4+rand()*0.9, 2.3, cols[(rand()*cols.length)|0], 4+rand()*5, true, (rand()-0.5)*14, rand()*TAU));
  }
}
function levelUp(){
  level++; stars++;
  Au.sfx("power");
  confetti(px, py-80, 26);
  floats.push(new FloatText(px, py-130, "¡NIVEL "+level+"!", C.GOLD, 1.4));
  rings.push(new Ring(px, py, 10, 150, 0.7, C.GOLD));
}
function die(){
  state=2; panelT=0; shake=1; flash=1;
  Au.duck(true); Au.sfx("over");
  burst(px, py, "#FFA0C8", 20, 1.4);
  rings.push(new Ring(px, py, 10, 190, 0.8, C.PINK));
  if(score > best){ best = score; newBest = true; localStorage.setItem("sky_best", best); Au.sfx("best"); }
}

// ------------------------------------------------------------ update
function update(dt){
  capeT += dt;
  const dir = (right?1:0) - (left?1:0);
  vx += dir*42*dt; vx *= 0.91; px += vx;
  if(px < 26) px = W-26; if(px > W-26) px = 26;
  vy += 880*dt; py += vy*dt;
  trail.push(new TrailDot(px, py+14));
  if(trail.length > 40) trail.shift();

  if(py > H*0.82 + 100 && !deathHandled){ deathHandled = true; die(); return; }

  for(const pl of platforms){
    if(pl.type === T_MOVING){
      pl.phase += pl.speed * dt / max(40, pl.range);
      pl.x = pl.baseX + sin(pl.phase) * pl.range;
    }
    const ys = pl.y + cameraY;
    if(vy > 0 && py+26 > ys && py+26 < ys+26 && px > pl.x-14 && px < pl.x+pl.w+14){
      py = ys - 26;
      vy = pl.type === T_BOOST ? -1010 : -640;
      score = max(score, ((H*0.78 - ys)/10)|0);
      jumpPulse = 1;
      if(pl.type === T_BOOST){
        Au.sfx("power");
        rings.push(new Ring(px, ys, 8, 110, 0.5, C.GOLD));
        burst(px, ys, C.GOLD, 16, 1.3);
        floats.push(new FloatText(px, ys-40, "¡IMPULSO!", C.GOLD, 0.9));
      } else {
        Au.sfx("jump");
        burst(px, ys, "#FFF3AD", 8, 1);
        rings.push(new Ring(px, ys, 6, 70, 0.4, "#FFFFFF"));
      }
    }
  }
  for(const pk of pickups){
    if(pk.taken) continue;
    const dy = pk.y + cameraY, dx = pk.x - px;
    if(abs(dx) < 34 && abs(dy - py) < 40){
      pk.taken = true;
      if(pk.gem){
        score += 50; stars += 5;
        Au.sfx("power");
        confetti(pk.x, dy, 20);
        floats.push(new FloatText(pk.x, dy-20, "+50", C.GOLD, 1.1));
        rings.push(new Ring(pk.x, dy, 8, 120, 0.6, C.GOLD));
        shake = 0.35;
      } else {
        combo = min(9, combo+1); comboTimer = 2.6;
        const pts = 10*combo; score += pts; stars++;
        Au.sfx("star");
        burst(pk.x, dy, C.GOLD, 10, 1);
        floats.push(new FloatText(pk.x, dy-16, combo>1 ? "+"+pts+"  x"+combo : "+"+pts, C.GOLD, 0.9));
        rings.push(new Ring(pk.x, dy, 6, 64, 0.45, C.GOLD));
      }
    }
  }
  if(combo > 0){ comboTimer -= dt; if(comboTimer <= 0) combo = 0; }
  const nl = (score/150|0) + 1;
  if(nl > level) levelUp();
  if(py < H*0.35){
    const d = H*0.35 - py;
    py = H*0.35; cameraY += d; spawnY += d;
  }
  while(platforms.length < 18) addPlatform();
  for(let i=platforms.length-1;i>=0;i--) if(platforms[i].y + cameraY > H+90) platforms.splice(i,1);
  for(let i=pickups.length-1;i>=0;i--) if(pickups[i].y + cameraY > H+90 || pickups[i].taken) pickups.splice(i,1);
  updateFx(dt);
  jumpPulse = max(0, jumpPulse - dt*3.2);
  shake = max(0, shake - dt*2.2);
}
function updateFx(dt){
  for(const s of particles){
    s.x += s.vx*dt; s.y += s.vy*dt;
    if(s.confetti){ s.vy += 420*dt; s.vx *= 0.99; s.rot += s.spin*dt; }
    else s.vy += 300*dt;
    s.life -= dt;
  }
  for(let i=particles.length-1;i>=0;i--) if(particles[i].life<=0) particles.splice(i,1);
  for(const r of rings) r.r += (r.maxR - r.r)*dt*7;
  for(let i=rings.length-1;i>=0;i--) if(rings[i].r > rings[i].maxR-1) rings.splice(i,1);
  for(const f of floats){ f.y -= 46*dt; f.life -= dt; }
  for(let i=floats.length-1;i>=0;i--) if(floats[i].life<=0) floats.splice(i,1);
  for(const t of trail) t.life -= dt;
  for(let i=trail.length-1;i>=0;i--) if(trail[i].life<=0) trail.splice(i,1);
  panelT = min(1, panelT + dt*2.2);
}

// ------------------------------------------------------------ drawing
function rgba(c,a){ return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function glow(x,y,r,color,alpha){
  const g = ctx.createRadialGradient(x,y,0,x,y,r);
  const c = Array.isArray(color) ? color : hex2rgb(color);
  g.addColorStop(0, rgba(c, alpha/255));
  g.addColorStop(1, rgba(c, 0));
  ctx.fillStyle = g;
  ctx.fillRect(x-r, y-r, r*2, r*2);
}
function hex2rgb(h){
  const n = parseInt(h.slice(1), 16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
const sparkPath = new Path2D();
sparkPath.moveTo(0,-1);
sparkPath.quadraticCurveTo(0,0,1,0); sparkPath.quadraticCurveTo(0,0,0,1);
sparkPath.quadraticCurveTo(0,0,-1,0); sparkPath.quadraticCurveTo(0,0,0,-1);
sparkPath.closePath();
function sparkle(x,y,r,color,rot=0){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.scale(r,r);
  ctx.fillStyle = color; ctx.fill(sparkPath);
  ctx.restore();
}
function font(px2, bold, align){
  ctx.font = `${bold?"800":"500"} ${px2}px sans-serif`;
  ctx.textAlign = align || "center";
  ctx.textBaseline = "alphabetic";
}

function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, rgba(C.SKY_TOP,1));
  g.addColorStop(1, rgba(C.SKY_BOT,1));
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const mx = W*0.82, my = H*0.12;
  glow(mx, my, 95, [255,240,220], 70);

  ctx.fillStyle = "rgba(160,130,190,0.16)";
  ctx.beginPath(); ctx.arc(mx-10,my-8,7,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(mx+12,my+6,9,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(mx+2,my+16,5,0,TAU); ctx.fill();
  for(const s of bgStars){
    const a = (0.35 + 0.65*(0.5 + 0.5*sin(time*s[3]+s[4]))) * 200;

function softCloud(x,y,w,h,color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, h/2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+w*0.25, y, h*0.55, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(x+w*0.52, y-h*0.28, h*0.75, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(x+w*0.78, y+h*0.05, h*0.6, 0, TAU); ctx.fill();
}

function drawButton(b, txtSize){
  b.press = max(0, b.press - 0.08);
  const s = 1 - b.press*0.07;
  const hw = b.w/2*s, hh = b.h/2*s;
  ctx.fillStyle = "rgba(20,10,50,0.35)";
  ctx.beginPath(); ctx.roundRect(b.x-hw, b.y-hh+5, hw*2, hh*2, hh); ctx.fill();
  const g = ctx.createLinearGradient(0, b.y-hh, 0, b.y+hh);
  g.addColorStop(0, b.cTop); g.addColorStop(1, b.cBot);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(b.x-hw, b.y-hh, hw*2, hh*2, hh); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.beginPath(); ctx.roundRect(b.x-hw+6, b.y-hh+4, hw*2-12, b.h*0.38, hh*0.8); ctx.fill();
  font(txtSize, true, "center");
  ctx.fillStyle = "#FFFFFF";
  ctx.fillText(b.label, b.x, b.y + txtSize*0.36);
}

function drawWorld(){
  ctx.save();
  if(shake > 0) ctx.translate((rand()-0.5)*14*shake, (rand()-0.5)*14*shake);
  for(const t of trail){
    const k = t.life/0.32;
    ctx.fillStyle = `rgba(255,170,215,${k*0.35})`;
    ctx.beginPath(); ctx.arc(t.x, t.y, 7*k, 0, TAU); ctx.fill();
  }
  for(const pl of platforms){
    const y = pl.y + cameraY;
    if(y < H+60 && y > -60) drawPlatform(pl, y);
  }
  for(const pk of pickups){
    const y = pk.y + cameraY + sin(time*3 + pk.phase)*5;
    if(y < -40 || y > H+40) continue;
    if(pk.gem){ glow(pk.x, y, 34, hex2rgb(C.GOLD), 150); drawGem(pk.x, y, 13); }
    else { glow(pk.x, y, 26, hex2rgb(C.GOLD), 110);
           sparkle(pk.x, y, 11 + 1.5*sin(time*4 + pk.phase), C.GOLD, time*90 + pk.phase); }
  }
  for(const s of particles){
    const a = clamp(s.life/s.maxLife, 0, 1);
    ctx.globalAlpha = a;
    if(s.confetti){
      ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.rot);
      ctx.fillStyle = s.color;
      ctx.fillRect(-s.size/2, -s.size/3, s.size, s.size/1.5);
      ctx.restore();
    } else {
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.size*a, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  for(const r of rings){
    const a = clamp(1 - r.r/r.maxR, 0, 1);
    ctx.strokeStyle = r.color; ctx.globalAlpha = a;
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if(state !== 2 || py < H){
    glow(px, py, 58, hex2rgb(C.PINK), 50);
    drawPrincess(px, py, 1 + jumpPulse*0.09);
  }
  for(const f of floats){
    const a = clamp(f.life/1.4, 0, 1);
    ctx.globalAlpha = a;
    font(19, true, "center");
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// ------------------------------------------------------------ loop
function frame(now){
  const dt = last===0 ? 0.016 : clamp((now-last)/1000, 0.001, 0.033);
  last = now; time += dt;

  drawSky();
  if(state===0) drawMenu();
  else if(state===1){ update(dt); drawWorld(); drawHud(); }
  else if(state===2){ updateFx(dt); drawWorld(); drawGameOver(); }
  else if(state===3) drawCredits();
  else if(state===4){ drawWorld(); drawHud(); drawPaused(); }

  if(flash > 0){
    flash = max(0, flash - dt*2.4);
    ctx.fillStyle = `rgba(255,255,255,${flash*0.67})`;
    ctx.fillRect(0,0,W,H);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ------------------------------------------------------------ input
function pointerPos(e){
  const r = cv.getBoundingClientRect();
  return [( (e.clientX ?? (e.touches&&e.touches[0].clientX)) - r.left) / r.width * W,
          ((e.clientY ?? (e.touches&&e.touches[0].clientY)) - r.top) / r.height * H];
}
function handleTap(x,y){
  if(state===0){
    if(btnPlay.hit(x,y)){ btnPlay.press=1; Au.sfx("click"); reset(); }
    else if(btnSound.hit(x,y)){ btnSound.press=1; const on = Au.toggle();
      btnSound.label = on ? "SONIDO: ON" : "SONIDO: OFF"; Au.sfx("click"); }
    else if(btnCredits.hit(x,y)){ btnCredits.press=1; Au.sfx("click"); state=3; }
  } else if(state===1){
    if(btnPause.hit(x,y)){ btnPause.press=1; Au.sfx("click"); state=4; Au.duck(true); }
  } else if(state===2){
    if(panelT > 0.6){
      if(btnRetry.hit(x,y)){ Au.duck(false); reset(); }
      else if(btnMenu.hit(x,y)){ Au.duck(false); Au.sfx("click"); state=0; }
    }
  } else if(state===3){
    if(btnBack.hit(x,y)){ btnBack.press=1; Au.sfx("click"); state=0; }
  } else if(state===4){
    if(btnResume.hit(x,y)){ Au.sfx("click"); state=1; Au.duck(false); }
    else if(btnExit.hit(x,y)){ Au.sfx("click"); state=0; Au.duck(false); }
  }
}
cv.addEventListener("pointerdown", e=>{
  e.preventDefault();
  Au.startMusic();
  const [x,y] = pointerPos(e);
  if(state===1){ left = x < W/2; right = x >= W/2; }
  handleTap(x,y);
});
cv.addEventListener("pointermove", e=>{
  if(state!==1 || e.buttons===0 && e.pointerType==="mouse") return;
  const [x] = pointerPos(e);
  left = x < W/2; right = x >= W/2;
});
cv.addEventListener("pointerup", ()=>{ left=false; right=false; });
cv.addEventListener("pointercancel", ()=>{ left=false; right=false; });

window.addEventListener("keydown", e=>{
  Au.startMusic();
  if(e.code==="ArrowLeft" || e.code==="KeyA") left = true;
  if(e.code==="ArrowRight"|| e.code==="KeyD") right = true;
  if(e.code==="Space" || e.code==="Enter"){
    if(state===0) reset();
    else if(state===2 && panelT>0.6){ Au.duck(false); reset(); }
  }
  if(e.code==="KeyP"){
    if(state===1){ state=4; Au.duck(true); }
    else if(state===4){ state=1; Au.duck(false); }
  }
  if(e.code==="KeyM"){ const on = Au.toggle(); btnSound.label = on ? "SONIDO: ON" : "SONIDO: OFF"; }
});
window.addEventListener("keyup", e=>{
  if(e.code==="ArrowLeft" || e.code==="KeyA") left = false;
  if(e.code==="ArrowRight"|| e.code==="KeyD") right = false;
});

// ------------------------------------------------------------ screenshot tour mode
// Usage: sky_dreams_preview.html?shots=1  — renders at 1080x2160, walks every
// screen, stages an attractive gameplay scene and POSTs PNGs to 127.0.0.1:8971.
(function(){
  const q = new URLSearchParams(location.search);
  if(q.get("shots") !== "1") return;
  const POST = "http://127.0.0.1:8971/";
  const SCALE = 1080 / W;

  // hi-res canvas
  const hi = document.createElement("canvas");
  hi.width = Math.round(W*SCALE); hi.height = Math.round(H*SCALE);
  const hctx = hi.getContext("2d");
  const mainCtx = ctx;
  function snap(name){
    ctx = hctx;                 // redirect every draw*() to the hi-res canvas
    ctx.setTransform(SCALE,0,0,SCALE,0,0);
    ctx.clearRect(0,0,W,H);
    drawSky();
    if(state===0) drawMenu();
    else if(state===1){ drawWorld(); drawHud(); }
    else if(state===2){ drawWorld(); drawGameOver(); }
    else if(state===3) drawCredits();
    else if(state===4){ drawWorld(); drawHud(); drawPaused(); }
    if(flash>0){ ctx.fillStyle=`rgba(255,255,255,${flash*0.67})`; ctx.fillRect(0,0,W,H); }
    ctx = mainCtx;
    const data = hi.toDataURL("image/png").split(",")[1];
    return fetch(POST, {method:"POST", body: JSON.stringify({name, data})});
  }
  const wait = ms => new Promise(r=>setTimeout(r,ms));
  async function run(){
    await wait(800);
    // 1. main menu
    best = Math.max(best, 412);   // show a nice record in the menu chip
    await snap("01_menu");
    // 2. staged gameplay scene
    reset();
    score = 347; level = 3; stars = 18; combo = 4; comboTimer = 1.9;
    cameraY = 880;               // positive: shows the upper platforms on screen
    px = W*0.32; py = H*0.42; vy = -640; vx = 60;
    capeT = 1.2; jumpPulse = 0.6;
    floats.push(new FloatText(px+70, py-60, "+40  x4", C.GOLD, 0.9));
    floats.push(new FloatText(W*0.72, H*0.30, "¡NIVEL 3!", C.GOLD, 1.3));
    burst(px, py+60, "#FFF3AD", 14, 1.1);
    rings.push(new Ring(px, py+60, 10, 90, 0.5, "#FFFFFF"));
    rings.push(new Ring(W*0.72, H*0.34, 12, 130, 0.6, C.GOLD));
    for(let i=0;i<14;i++){ trail.push(new TrailDot(px+ (rand()-0.5)*8, py+80+i*14)); trail[trail.length-1].life = 0.32 - i*0.02; }
    await snap("02_gameplay_comboBox");
    // 3. gem + boost action scene
    score = 512; level = 4; stars = 27; combo = 0; comboTimer = 0;
    floats.length = 0; rings.length = 0; particles.length = 0;
    cameraY = 1560; px = W*0.62; py = H*0.36; vy = -900; vx = -40;
    floats.push(new FloatText(px, py-70, "¡IMPULSO!", C.GOLD, 0.9));
    burst(px, py+80, C.GOLD, 18, 1.3);
    rings.push(new Ring(px, py+80, 10, 120, 0.55, C.GOLD));
    confetti(W*0.62, H*0.42, 12);
    flash = 0.25;
    await snap("03_gameplay_impulso");
    // 4. game over with new record
    floats.length = 0; rings.length = 0; particles.length = 0;
    state = 2; panelT = 1; newBest = true; score = 512; stars = 27; best = 512;
    py = H + 300;              // hide Grace behind the bottom edge
    confetti(W*0.28, H*0.16, 10); confetti(W*0.72, H*0.30, 10);
    await wait(100);
    await snap("04_nuevo_record");
    // 5. credits
    state = 3;
    await snap("05_creditos");
    document.title = "SHOTS DONE";
  }
  run();
})();
